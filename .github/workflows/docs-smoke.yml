name: docs-smoke\non:  \n  push:  \n    branches: [ 'docs/init' ]\n  workflow_dispatch: {}\n\njobs:  \n  smoke:  \n    runs-on: ubuntu-latest\n    steps:  \n      - uses: actions/checkout@v4\n      - name: Set up Python\n        uses: actions/setup-python@v4\n        with:  \n          python-version: '3.10'\n      - name: Install deps\n        run: |\n          python -m pip install --upgrade pip\n          pip install sentence-transformers faiss-cpu rank_bm25\n      - name: Mine hard negatives (smoke)\n        run: |\n          python examples/mine_hard_negatives.py --input examples/data/sample_job_data.jsonl --mode combined --K 10 --M 2\n      - name: Train (smoke)\n        run: |\n          python examples/train_dual_encoder.py --data examples/data/sample_job_data.jsonl --hard_neg hard_negatives.jsonl --model_name all-MiniLM-L12-v2 --output output/dual_encoder_ci --batch_size 8 --epochs 1\n      - name: Build index & run sample query\n        run: |\n          python examples/build_index_and_search.py --data examples/data/sample_job_data.jsonl --model output/dual_encoder_ci --index_path faiss_ci.index --doc_map doc_map_ci.json\n